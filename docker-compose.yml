services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taletso_signage}
      POSTGRES_USER: ${POSTGRES_USER:-taletso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      XIBO_BASE_URL: ${XIBO_BASE_URL:-}
      XIBO_CLIENT_ID: ${XIBO_CLIENT_ID:-}
      XIBO_CLIENT_SECRET: ${XIBO_CLIENT_SECRET:-}
      XIBO_MODE: ${XIBO_MODE:-mock}
      TDCP_PLAYER_ROOT: ${TDCP_PLAYER_ROOT:-/tdcp/player}
      TDCP_BACKUP_ROOT: ${TDCP_BACKUP_ROOT:-/tdcp/backups}
    volumes:
      - /opt/cyrus/stacks/cms-tv/player:/tdcp/player
      - /opt/cyrus/stacks/cms-tv/backups:/tdcp/backups
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
